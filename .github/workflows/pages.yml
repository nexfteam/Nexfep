name: Deploy website to Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'README.md'
      - 'README-CN.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r website/. _site/
          for f in README.md README-CN.md; do
            if [ -f "$f" ]; then
              awk 'BEGIN{p=0} /^##[[:space:]]/{p=1} p{print}' "$f" > "_site/$f"
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4